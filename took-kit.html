<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小工具合集 · 多功能工具箱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%232563eb'/%3E%3Cpath d='M7 9l3 3-3 3m5 2h5' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ===== 主题变量系统 ===== */
:root{
  --bg:#f5f7fb; --bg2:#fff; --bg3:#eef1f6; --text:#1c2333; --muted:#6b7488;
  --border:#e3e8f0; --accent:#2563eb; --accent2:#4f8cff; --onaccent:#fff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --shadow-lg:0 8px 40px rgba(16,24,40,.16);
  --radius:14px; --sidebar:#0f1526;
}
[data-theme="dark"]{
  --bg:#0e1320; --bg2:#161d2e; --bg3:#1d2640; --text:#e7ecf6; --muted:#8a94ab;
  --border:#263049; --accent:#5b8cff; --accent2:#7aa7ff; --onaccent:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5); --sidebar:#0a0f1d;
}
[data-theme="ocean"]{
  --bg:#eef4fb; --bg2:#fff; --bg3:#e3edf8; --text:#0f2438; --muted:#4f6d87;
  --border:#d3e2f1; --accent:#0ea5e9; --accent2:#38bdf8; --onaccent:#fff;
  --shadow:0 1px 2px rgba(14,116,144,.08),0 4px 16px rgba(14,116,144,.08);
  --shadow-lg:0 8px 40px rgba(14,116,144,.18); --sidebar:#0a2e4a;
}
[data-theme="forest"]{
  --bg:#f0f6f2; --bg2:#fff; --bg3:#e1efe5; --text:#16301f; --muted:#4c6b57;
  --border:#d2e4d6; --accent:#16a34a; --accent2:#4ade80; --onaccent:#fff;
  --shadow:0 1px 2px rgba(22,101,52,.08),0 4px 16px rgba(22,101,52,.08);
  --shadow-lg:0 8px 40px rgba(22,101,52,.16); --sidebar:#0b2b16;
}
[data-theme="sunset"]{
  --bg:#fbf5f0; --bg2:#fff; --bg3:#f7e9de; --text:#3a2215; --muted:#8a6350;
  --border:#eddbcd; --accent:#ea580c; --accent2:#f97316; --onaccent:#fff;
  --shadow:0 1px 2px rgba(234,88,12,.08),0 4px 16px rgba(234,88,12,.08);
  --shadow-lg:0 8px 40px rgba(234,88,12,.16); --sidebar:#2d1508;
}
[data-theme="violet"]{
  --bg:#f4f2fb; --bg2:#fff; --bg3:#ebe6f7; --text:#2a2140; --muted:#6f6291;
  --border:#ddd6f0; --accent:#7c3aed; --accent2:#a78bfa; --onaccent:#fff;
  --shadow:0 1px 2px rgba(124,58,237,.08),0 4px 16px rgba(124,58,237,.08);
  --shadow-lg:0 8px 40px rgba(124,58,237,.16); --sidebar:#1e0f3a;
}
[data-theme="coffee"]{
  --bg:#f6f2ec; --bg2:#fffdf9; --bg3:#efe6da; --text:#33251a; --muted:#7c6b59;
  --border:#e4d7c6; --accent:#92400e; --accent2:#c2703a; --onaccent:#fff;
  --shadow:0 1px 2px rgba(146,64,14,.07),0 4px 16px rgba(146,64,14,.07);
  --shadow-lg:0 8px 40px rgba(146,64,14,.15); --sidebar:#2a1a0e;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;font-size:14px;
  transition:background .3s,color .3s;min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}

/* ===== 应用布局 ===== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex-shrink:0;background:var(--sidebar);color:#cbd5e1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  transition:width .25s;z-index:30;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;color:#fff;font-weight:700;font-size:16px}
.sidebar .brand svg{flex-shrink:0}
.sidebar .brand span{white-space:nowrap;overflow:hidden}
.sidebar nav{padding:0 10px 16px;flex:1}
.cat-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7c88a5;padding:10px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;
  border-radius:9px;color:#cbd5e1;margin-bottom:2px;font-size:14px;transition:background .15s;position:relative;
}
.nav-item svg{flex-shrink:0;opacity:.9}
.nav-item .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:0 7px;border-radius:8px;color:#b6c2d9}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
.nav-item.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.sidebar-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7c88a5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
}
.search-wrap{flex:1;max-width:520px;position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-input{
  width:100%;padding:10px 12px 10px 36px;border-radius:11px;border:1px solid var(--border);
  background:var(--bg2);font-size:14px;outline:none;transition:border .15s;
}
.search-input:focus{border-color:var(--accent)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);
  display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s;
}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* 语言切换滑条 */
.lang-switch{display:flex;align-items:center;gap:8px;margin-right:4px}
.lang-switch .lang-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.lang-switch .lang-label.active{color:var(--accent)}
.switch-track{
  position:relative;width:52px;height:26px;border-radius:13px;background:var(--bg3);
  border:1px solid var(--border);cursor:pointer;transition:background .2s, border-color .2s;flex:none;
}
.switch-track:hover{border-color:var(--accent)}
.switch-track .knob{
  position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);transition:left .25s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;
}
.switch-track.en .knob{left:28px}
.switch-track:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:560px){.lang-switch .lang-label{display:none}}

/* 皮肤切换弹层 */
.skin-pop{position:absolute;top:54px;right:20px;z-index:40;background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow-lg);padding:14px;width:280px;display:none}
.skin-pop.show{display:block}
.skin-pop h4{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600}
.skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin-item{border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;font-size:11px;color:var(--muted);transition:all .15s;background:var(--bg)}
.skin-item:hover{border-color:var(--accent)}
.skin-item.active{border-color:var(--accent);color:var(--accent);font-weight:600}
.skin-swatch{height:26px;border-radius:7px;margin-bottom:6px;border:1px solid rgba(0,0,0,.08)}

.content{flex:1;padding:22px 26px 60px;max-width:1280px;width:100%;margin:0 auto}
.content-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.content-head h1{font-size:22px;font-weight:700}
.content-head .desc{color:var(--muted);margin-bottom:20px;font-size:13px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tool-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;
  display:flex;flex-direction:column;gap:8px;min-height:96px;text-align:left;
}
.tool-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.tool-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool-card .t-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.tool-card .t-name .ico{color:var(--accent);flex-shrink:0}
.tool-card .t-desc{font-size:12px;color:var(--muted);line-height:1.5}

/* ===== 工具面板 ===== */
.panel-overlay{position:fixed;inset:0;background:rgba(10,14,26,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.panel-overlay.show{display:flex}
.panel{
  background:var(--bg2);border-radius:18px;box-shadow:var(--shadow-lg);width:min(720px,100%);
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.panel-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.panel-head .ico{color:var(--accent)}
.panel-head h2{font-size:17px;font-weight:700}
.panel-head .close{margin-left:auto}
.panel-body{flex:1;overflow-y:auto;padding:22px}
.panel-body .t-desc{color:var(--muted);font-size:13px;margin-bottom:16px}

/* 通用表单组件 */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px}
textarea.in, input.in, select.in{
  width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);
  outline:none;transition:border .15s;resize:vertical;font-size:14px;
}
textarea.in{min-height:96px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;font-size:13px}
input.in:focus, textarea.in:focus, select.in:focus{border-color:var(--accent)}
input[type=number].in{font-family:inherit}
.btn{
  padding:10px 18px;border-radius:10px;background:var(--accent);color:var(--onaccent);
  font-size:14px;font-weight:600;transition:filter .15s,transform .05s;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}

.out-box{
  margin-top:6px;border:1px solid var(--border);border-radius:10px;background:var(--bg);
  padding:12px;font-size:13px;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
}
.out-box .o-label{font-family:inherit;font-weight:600;color:var(--muted);font-size:11px;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.copy-btn{margin-left:auto}
.result-num{font-size:30px;font-weight:800;color:var(--accent);line-height:1.2}
.result-sub{color:var(--muted);font-size:13px;margin-top:4px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-box .v{font-size:20px;font-weight:700;color:var(--accent)}
.stat-box .k{font-size:11px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
table.data th{background:var(--bg3);font-weight:600}
.swatch{width:100%;height:44px;border-radius:10px;border:1px solid var(--border)}
.swatch-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:10px}
.swatch-mini{height:48px;border-radius:9px;border:1px solid var(--border);cursor:pointer;position:relative}
.swatch-mini span{position:absolute;left:6px;bottom:4px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.swatch-mini.light span{color:#222;text-shadow:none}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:6px 0}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.check-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.check-row label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.check-row input{width:15px;height:15px;accent-color:var(--accent)}
.color-preview{display:inline-flex;align-items:center;gap:10px;margin-bottom:8px}
.color-dot{width:34px;height:34px;border-radius:9px;border:1px solid var(--border)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace}

/* 时间轴 / 结果列表 */
ul.plain{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:8px}
ul.plain li{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:13px}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 30%,transparent);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}
::-webkit-scrollbar-track{background:transparent}

.empty{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}
.empty svg{opacity:.35;margin-bottom:12px}

/* ===== 响应式 ===== */
@media (max-width:1080px){.tool-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){.tool-grid{grid-template-columns:repeat(2,1fr)}.sidebar{width:64px}.sidebar .brand span,.sidebar .cat-label,.nav-item .t, .nav-item .cnt{display:none}.sidebar nav{padding:0 8px}.nav-item{justify-content:center;padding:11px 0}}
@media (max-width:560px){
  .tool-grid{grid-template-columns:1fr 1fr}.content{padding:16px 14px 50px}
  .topbar{padding:10px 12px}.skin-pop{right:12px}
  .grid2,.grid3{grid-template-columns:1fr}.panel{max-height:96vh}
  .panel-body{padding:16px}
  .search-input, input.in, textarea.in{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="5" fill="var(--accent)"/><path d="M7 9l3 3-3 3m5 2h5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>小工具合集</span>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">离线可用 · 数据不离开本机</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="search-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="search-input" id="searchInput" placeholder="搜索工具，如：JSON、时间戳、密码…" autocomplete="off">
      </div>
      <div class="top-actions">
        <div class="lang-switch" id="langSwitch" title="中英文切换 / Language" role="switch" aria-checked="false" tabindex="0">
          <span class="lang-label active" data-l="zh">中</span>
          <div class="switch-track" id="langTrack"><div class="knob" id="langKnob">中</div></div>
          <span class="lang-label" data-l="en">EN</span>
        </div>
        <button class="icon-btn" id="skinBtn" title="切换皮肤" aria-label="切换皮肤">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/><path d="M12 2v20"/><path d="M2 12h20" stroke-dasharray="2 3"/></svg>
        </button>
        <button class="icon-btn" id="toggleTheme" title="明暗切换" aria-label="明暗切换">
          <svg id="themeIco" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
      </div>
      <div class="skin-pop" id="skinPop">
        <h4>选择皮肤主题</h4>
        <div class="skin-grid" id="skinGrid"></div>
      </div>
    </div>

    <div class="content">
      <div class="crumb" id="crumb">全部工具</div>
      <div class="content-head"><h1 id="pageTitle">全部工具</h1></div>
      <div class="desc" id="pageDesc">共 <span id="totalCnt">0</span> 个实用小工具，点击卡片即可使用。</div>
      <div class="tool-grid" id="toolGrid"></div>
    </div>
  </div>
</div>

<!-- 工具面板 -->
<div class="panel-overlay" id="panelOverlay">
  <div class="panel">
    <div class="panel-head">
      <svg class="ico" id="panelIco" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      <h2 id="panelTitle"></h2>
      <button class="icon-btn close" id="panelClose" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<script>
"use strict";
/* ===== 基础工具函数 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copyText=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){return false}document.body.removeChild(ta);return true}};
const toast=(msg)=>{let el=document.createElement('div');el.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:999;box-shadow:var(--shadow-lg);transition:opacity .3s';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300)},1500)};
function setVal(id,v){const e=$('#'+id);if(!e)return;const t=e.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')e.value=v;else e.textContent=v}
function getVal(id){const e=$('#'+id);if(!e)return'';const t=e.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return e.value;return e.textContent||''}
function outBox(html){return '<div class="out-box">'+html+'</div>'}
function btnRow(btns){return '<div class="btn-row">'+btns.map(b=>'<button class="btn '+b.cls+'" data-act="'+b.act+'" data-pid="'+b.pid+'">'+b.label+'</button>').join('')+'</div>'}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},400);
}
function canvasToBMP(canvas){
  const w=canvas.width,h=canvas.height,ctx=canvas.getContext('2d');
  const img=ctx.getImageData(0,0,w,h).data;
  const rowSize=Math.floor((24*w+31)/32)*4;
  const pixelArraySize=rowSize*h;
  const fileSize=54+pixelArraySize;
  const buf=new ArrayBuffer(fileSize),v=new DataView(buf);
  let o=0;
  v.setUint8(o++,0x42);v.setUint8(o++,0x4D);               // 'BM'
  v.setUint32(o,fileSize,true);o+=4;
  v.setUint16(o,0,true);o+=2; v.setUint16(o,0,true);o+=2;   // reserved
  v.setUint32(o,54,true);o+=4;                              // pixel data offset
  v.setUint32(o,40,true);o+=4;                              // DIB header size
  v.setInt32(o,w,true);o+=4; v.setInt32(o,h,true);o+=4;     // width, height (positive = bottom-up)
  v.setUint16(o,1,true);o+=2;                               // planes
  v.setUint16(o,24,true);o+=2;                              // bpp
  v.setUint32(o,0,true);o+=4;                               // compression BI_RGB
  v.setUint32(o,pixelArraySize,true);o+=4;
  v.setInt32(o,2835,true);o+=4; v.setInt32(o,2835,true);o+=4; // 72 dpi
  v.setUint32(o,0,true);o+=4; v.setUint32(o,0,true);o+=4;   // colors used, important
  let p=54;
  for(let y=h-1;y>=0;y--){
    let row=p;
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      v.setUint8(row++,img[i+2]); // B
      v.setUint8(row++,img[i+1]); // G
      v.setUint8(row++,img[i]);   // R
    }
    p+=rowSize;
  }
  return buf;
}

function wcStats(s){
  const chars=[...s].length;
  const charsNoSpace=[...s.replace(/\s/g,'')].length;
  const words=s.trim()?s.trim().split(/\s+/).length:0;
  const lines=s.split(/\r?\n/).length;
  const paras=s.split(/\n\s*\n/).filter(p=>p.trim()!=='').length;
  const st=$('#t-wc-stats');
  if(st)st.innerHTML=[
    ['字符数(含空格)',chars],['字符数(不含空格)',charsNoSpace],['单词数',words],['行数',lines],['段落数',paras],['字符/行',lines?Math.round(chars/lines):0]
  ].map(x=>'<div class="stat-box"><div class="v">'+x[1]+'</div><div class="k">'+x[0]+'</div></div>').join('');
}

function biTool(pid,opts){
  // opts: {name, encode, decode, placeholder, mode}
  return '<div class="field"><label>输入</label><textarea class="in" id="'+pid+'" rows="5" placeholder="'+opts.placeholder+'"></textarea></div>'
  +'<div class="btn-row"><button class="btn" data-act="enc" data-pid="'+pid+'">'+(opts.encLabel||'编码')+'</button><button class="btn ghost" data-act="dec" data-pid="'+pid+'">'+(opts.decLabel||'解码')+'</button></div>'
  +'<div class="out-box" id="out-'+pid+'"><span class="o-label">结果</span><span id="v-'+pid+'">—</span></div>'
  +'<button class="btn ghost sm copy-btn" data-act="copy" data-pid="'+pid+'">复制</button>';
}

ACT.dec=(b,pid)=>{const t=TOOLS[pid];if(t&&t.decode)try{setVal('v-'+pid,t.decode(getVal(pid)))}catch(e){setVal('v-'+pid,'解码失败：'+e.message)}};

function gcd(a,b){while(b){[a,b]=[b,a%b]}return Math.abs(a)}
function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function comb(n,r){return fact(n)/(fact(r)*fact(n-r))}

function fmtFull(d){const p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(!/^[0-9a-fA-F]{6}$/.test(h))return null;return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('')}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0;const l=(max+min)/2;if(max!==min){const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);if(max===r)h=(g-b)/d+(g<b?6:0);else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6}return [Math.round(h*360),Math.round(s*100),Math.round(l*100)]}
function hslToRgb(h,s,l){h=(h%360)/360;s/=100;l/=100;if(s===0)return [l*255,l*255,l*255];const q=l<0.5?l*(1+s):l+s-l*s;const p=2*l-q;const t=(h+1/3)%1,t2=h,t3=(h+2/3)%1;const ch=c=>{if(c<1/6)return p+(q-p)*6*c;if(c<1/2)return q;if(c<2/3)return p+(q-p)*(2/3-c)*6;return p};return [ch(t)*255,ch(t2)*255,ch(t3)*255]}

 },run(){const base=getVal('c-pal-base');const rgb=hexToRgb(base),hsl=rgbToHsl(rgb[0],rgb[1],rgb[2]);const type=getVal('c-pal-type');let hues=[];if(type==='mono'){hues=[hsl[0]];const lvl=[88,72,56,40,28];$('#c-pal-out').innerHTML='<div class="swatch-row">'+lvl.map(l=>{const c=rgbToHex(...hslToRgb(hsl[0],Math.min(100,Math.max(0,hsl[1]+5)),l));return '<div class="swatch-mini light" style="background:'+c+'"><span>'+c+'</span></div>'}).join('')+'</div>';(window._cbase=base);return}if(type==='analog')hues=[(hsl[0]-30+360)%360,hsl[0],(hsl[0]+30)%360];if(type==='comp')hues=[hsl[0],(hsl[0]+180)%360];if(type==='triad')hues=[hsl[0],(hsl[0]+120)%360,(hsl[0]+240)%360];const colors=hues.map(h=>rgbToHex(...hslToRgb(h,hsl[1],hsl[2])));const all=hues.map(h=>[rgbToHex(...hslToRgb(h,hsl[1],82)),rgbToHex(...hslToRgb(h,hsl[1],56)),rgbToHex(...hslToRgb(h,hsl[1],30))]).flat();$('#c-pal-out').innerHTML='<div class="swatch-row">'+all.map(c=>'<div class="swatch-mini'+(hexToRgb(c)[0]*0.299+hexToRgb(c)[1]*0.587+hexToRgb(c)[2]*0.114>160?' light':'')+'" style="background:'+c+'" data-copy="'+c+'"><span>'+c+'</span></div>').join('')+'</div>'}},
 {id:'c-contrast',name:'对比度检测',desc:'检测前景/背景色的可读性',cat:'color',render(){
   return '<div class="grid2"><div class="field"><label>前景色</label><input class="in" type="color" id="c-con-fg" value="#111111" style="height:44px"></div><div class="field"><label>背景色</label><input class="in" type="color" id="c-con-bg" value="#ffffff" style="height:44px"></div></div>'
   +btnRow([{act:'run',label:'检测',pid:'c-contrast'}])
   +'<div id="c-con-out"></div>';
 },run(){const fg=hexToRgb(getVal('c-con-fg')),bg=hexToRgb(getVal('c-con-bg'));const lum=c=>{const a=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]};const L1=lum(fg),L2=lum(bg);const ratio=(Math.max(L1,L2)+0.05)/(Math.min(L1,L2)+0.05);let grade=ratio>=7?'AAA(优秀)':ratio>=4.5?'AA(合格)':ratio>=3?'AA大号文字':'不达标';const rows=[['对比度',ratio.toFixed(2)+':1'],['WCAG 评级',grade],['标准文字','≥4.5 '+(ratio>=4.5?'✓':'✗')],['大号文字','≥3 '+(ratio>=3?'✓':'✗')]];$('#c-con-out').innerHTML='<div class="swatch" style="background:'+getVal('c-con-bg')+';color:'+getVal('c-con-fg')+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px">示例文字 Abc 123</div><div class="stat-row" style="margin-top:12px">'+rows.map(x=>'<div class="stat-box"><div class="v">'+x[1]+'</div><div class="k">'+x[0]+'</div></div>').join('')+'</div>';}},
 {id:'c-mix',name:'颜色混合',desc:'混合两个颜色得到新颜色',cat:'color',render(){
   return '<div class="grid3"><div class="field"><label>颜色 1</label><input class="in" type="color" id="c-mix-a" value="#ff0000" style="height:44px"></div><div class="field"><label>颜色 2</label><input class="in" type="color" id="c-mix-b" value="#0000ff" style="height:44px"></div><div class="field"><label>比例1(%)</label><input class="in" type="number" id="c-mix-p" value="50" min="0" max="100"></div></div>'
   +btnRow([{act:'run',label:'混合',pid:'c-mix'}])

 },run(){const a=hexToRgb(getVal('c-mix-a')),b=hexToRgb(getVal('c-mix-b'));const p=Math.max(0,Math.min(100,parseInt(getVal('c-mix-p'))||50))/100;const rgb=a.map((v,i)=>v*p+b[i]*(1-p));const c=rgbToHex(rgb[0],rgb[1],rgb[2]);$('#c-mix-out').innerHTML='<div class="swatch" style="background:'+c+'"></div><div class="hint" style="color:var(--muted)">混合结果：<span class="mono" style="font-weight:700;color:var(--text)">'+c+'</span>　rgb('+rgb.map(Math.round).join(', ')+')</div>'}},
 {id:'c-shade',name:'明暗调色',desc:'生成颜色的亮/暗色阶',cat:'color',render(){

 },run(){const rgb=hexToRgb(getVal('c-shade-in')),hsl=rgbToHsl(rgb[0],rgb[1],rgb[2]);const steps=[10,25,40,55,70,85,95];const light=steps.map(l=>rgbToHex(...hslToRgb(hsl[0],hsl[1],l)));const dark=steps.map(l=>rgbToHex(...hslToRgb(hsl[0],Math.min(100,hsl[1]+15),l))).reverse();$('#c-shade-out').innerHTML='<div class="swatch-row">'+light.map(c=>'<div class="swatch-mini'+(hexToRgb(c)[0]*0.299+hexToRgb(c)[1]*0.587+hexToRgb(c)[2]*0.114>160?' light':'')+'" style="background:'+c+'" data-copy="'+c+'"><span>'+c+'</span></div>').join('')+'</div><div class="swatch-row">'+dark.map(c=>'<div class="swatch-mini'+(hexToRgb(c)[0]*0.299+hexToRgb(c)[1]*0.587+hexToRgb(c)[2]*0.114>160?' light':'')+'" style="background:'+c+'" data-copy="'+c+'"><span>'+c+'</span></div>').join('')+'</div>'}},
 {id:'c-names',name:'颜色明度',desc:'计算颜色的亮度、饱和等属性',cat:'color',render(){

 {id:'c-grad',name:'渐变预览',desc:'生成并预览 CSS 渐变',cat:'color',render(){

 {id:'c-mean',name:'主色提取',desc:'从常用配色取一组默认色卡',cat:'color',render(){

function genMaterial(){const base=['#f44336','#e91e63','#9c27b0','#673ab7','#3f51b5','#2196f3','#03a9f4','#00bcd4','#009688','#4caf50','#8bc34a','#cddc39','#ff9800','#ff5722','#795548'];const shades=[500,400,600,300,700];const colors=base.flatMap(c=>{const [r,g,b]=hexToRgb(c);const hsl=rgbToHsl(r,g,b);return shades.map(s=>rgbToHex(...hslToRgb(hsl[0],hsl[1],{300:78,400:66,500:54,600:44,700:36}[s]||50)))});$('#c-mean-out').innerHTML='<div class="swatch-row">'+colors.map(c=>'<div class="swatch-mini'+(hexToRgb(c)[0]*0.299+hexToRgb(c)[1]*0.587+hexToRgb(c)[2]*0.114>160?' light':'')+'" style="background:'+c+'" data-copy="'+c+'"><span>'+c+'</span></div>').join('')+'</div>';(window._cbase=c);}
function genFlat(){const colors=['#1abc9c','#16a085','#2ecc71','#27ae60','#3498db','#2980b9','#9b59b6','#8e44ad','#e74c3c','#c0392b','#e67e22','#d35400','#f39c12','#f1c40f','#34495e','#2c3e50','#ecf0f1','#95a5a6'];$('#c-mean-out').innerHTML='<div class="swatch-row">'+colors.map(c=>'<div class="swatch-mini'+(hexToRgb(c)[0]*0.299+hexToRgb(c)[1]*0.587+hexToRgb(c)[2]*0.114>160?' light':'')+'" style="background:'+c+'" data-copy="'+c+'"><span>'+c+'</span></div>').join('')+'</div>';}
function randNamed(){const names=['海蓝','天青','薄荷','珊瑚','琥珀','莓紫','墨绿','绯红','银灰','鹅黄','黛蓝','藕荷','茶褐','藏青','品红','碧空','松绿','朱砂','宝蓝','杏黄'];const colors=names.map(n=>rgbToHex(Math.floor(Math.random()*256),Math.floor(Math.random()*256),Math.floor(Math.random()*256)));$('#c-rn-out').innerHTML='<div class="swatch-row">'+colors.map((c,i)=>'<div class="swatch-mini'+(hexToRgb(c)[0]*0.299+hexToRgb(c)[1]*0.587+hexToRgb(c)[2]*0.114>160?' light':'')+'" style="background:'+c+'" data-copy="'+c+'"><span>'+names[i]+'</span></div>').join('')+'</div>';}

 {id:'v-json',name:'JSON 格式化',desc:'格式化/校验 JSON 数据',cat:'dev',render(){

 {id:'v-jsonpath',name:'JSON 路径取值',desc:'用点路径提取 JSON 深层字段',cat:'dev',render(){

 {id:'v-csv',name:'CSV↔JSON',desc:'CSV 与 JSON 数组互转',cat:'dev',render(){

   +'<button class="btn ghost sm copy-btn" data-act="copy" data-pid="v-csv">复制</button>';
 },csv2json(){const s=getVal('v-csv');const lines=s.split(/\r?\n/).filter(l=>l.trim()!=='');if(!lines.length){setVal('v-v-csv','无数据');return}const parseLine=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else{if(c==='"')q=true;else if(c===','){out.push(cur);cur=''}else cur+=c}}out.push(cur);return out};const heads=parseLine(lines[0]);const rows=lines.slice(1).map(parseLine);const arr=rows.map(r=>{const o={};heads.forEach((h,i)=>o[h]=r[i]||'');return o});setVal('v-v-csv',JSON.stringify(arr,null,2))},json2csv(){const s=getVal('v-csv');try{const arr=JSON.parse(s);if(!Array.isArray(arr)||!arr.length){setVal('v-v-csv','需为 JSON 数组');return}const heads=Object.keys(arr[0]);const csv=arr.map(r=>heads.map(h=>{const v=r[h];return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')).join('\n');setVal('v-v-csv',heads.join(',')+'\n'+csv)}catch(e){setVal('v-v-csv','JSON 解析失败')}}},
 {id:'v-regex',name:'正则测试',desc:'正则表达式匹配测试与捕获',cat:'dev',render(){
   return '<div class="field"><label>正则表达式</label><input class="in mono" id="v-rx-pattern" placeholder="\\d+"></div>'

   +btnRow([{act:'run',label:'测试',pid:'v-regex'}])

 },run(){const pat=getVal('v-rx-pattern');if(!pat){$('#v-rx-out').innerHTML='';return}const flags=(getVal('v-rx-g')?'g':'')+(getVal('v-rx-i')?'i':'')+(getVal('v-rx-m')?'m':'');try{const re=new RegExp(pat,flags);const text=getVal('v-rx-text');let m;const matches=[];const g=flags.includes('g');do{m=re.exec(text);if(m){matches.push(m[0]);if(!g)break;if(m.index===re.lastIndex)re.lastIndex++}}while(m&&g);$('#v-rx-out').innerHTML='<div class="stat-row"><div class="stat-box"><div class="v">'+matches.length+'</div><div class="k">匹配数</div></div></div><div class="out-box"><span class="o-label">匹配结果</span>'+matches.map((x,i)=>'<div style="padding:2px 0">['+i+'] '+esc(x)+'</div>').join('')+(matches.length?'':'（无匹配）')+'</div>'}catch(e){$('#v-rx-out').innerHTML='<div class="out-box">正则错误：'+esc(e.message)+'</div>'}}},

function markdownToHtml(md){
  const escT=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let lines=md.split(/\r?\n/);let html='';let listType=null;
  const inline=s=>escT(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  for(let i=0;i<lines.length;i++){const l=lines[i];
    if(/^#{1,6}\s/.test(l)){html+='<h'+(l.match(/^#+/)[0].length)+'>'+inline(l.replace(/^#+\s+/,''))+'</h'+l.match(/^#+/)[0].length+'>\n';continue}
    const ulm=l.match(/^\s*[-*+]\s+(.*)/);const olm=l.match(/^\s*\d+\.\s+(.*)/);
    if(ulm||olm){const t=ulm?'ul':'ol';if(listType!==t){if(listType)html+='</'+listType+'>\n';html+='<'+t+'>\n';listType=t}html+='<li>'+inline((ulm||olm)[1])+'</li>\n';continue}
    if(listType){html+='</'+listType+'>\n';listType=null}
    if(/^\s*[-*_]\s*$/.test(l)){html+='<hr>\n';continue}
    if(/^>\s?/.test(l)){html+='<blockquote>'+inline(l.replace(/^>\s?/,''))+'</blockquote>\n';continue}
    if(l.trim()===''){html+='\n';continue}
    html+='<p>'+inline(l)+'</p>\n';
  }
  if(listType)html+='</'+listType+'>\n';
  return html;
}

/* 通用换算器工厂：units: {值:单位名}，baseFactor: 相对标准单位倍数 */
function fmtNum(n){if(!isFinite(n))return '∞';if(n===0)return '0';if(Math.abs(n)>=1e15||Math.abs(n)<1e-6)return n.toExponential(6);return Number(n.toPrecision(10)).toLocaleString('zh-CN',{maximumFractionDigits:6})}
/* 通用单位换算工厂：支持“数值+单位”自动识别（中文/英文/符号别名），单位为线性比例 */
function makeConvertTool(id,name,desc,units,factors,alias,defaults){
  const keys=Object.keys(units);
  const aliasMap={};
  const addAlias=(a,k)=>{if(!a)return;const x=String(a).toLowerCase().replace(/\s+/g,'');if(x&&!(x in aliasMap))aliasMap[x]=k};
  keys.forEach(k=>{
    addAlias(k,k);
    const disp=units[k].replace(/[（(].*?[)）]/g,'').trim();
    addAlias(disp,k);
    const m=units[k].match(/[（(]([^)）]*)[)）]/);if(m)addAlias(m[1],k);
    (alias[k]||[]).forEach(a=>addAlias(a,k));
  });
  const aliasList=Object.keys(aliasMap).sort((a,b)=>b.length-a.length);
  function parseUnit(text,fallback){
    if(text==null)return null;
    const mm=String(text).trim().match(/^([-+]?\d[\d,]*\.?\d*(?:[eE][-+]?\d+)?)\s*(.*)$/);
    if(!mm||mm[1]===''||isNaN(parseFloat(mm[1].replace(/,/g,''))))return null;
    const num=parseFloat(mm[1].replace(/,/g,''));
    let u=mm[2].trim();
    if(!u)return {v:num,key:fallback,ok:true};
    const un=u.toLowerCase().replace(/\s+/g,'').replace(/[。，,.]+$/,'');
    for(const a of aliasList){if(un===a||un.indexOf(a)===0)return {v:num,key:aliasMap[a],ok:true}}
    return {v:num,key:fallback,ok:false};
  }
  return {id:id,name:name,desc:desc,cat:'convert',render(){
    const ph=(defaults&&defaults.text)?defaults.text:('123'+units[defaults.from]);
    return '<div class="field"><label>输入（数值+单位，自动识别）</label><input class="in" type="text" id="'+id+'-v" placeholder="'+esc(ph)+'"></div>'
    +'<div class="field"><label>单位（未识别时可手动选择）</label><select class="in" id="'+id+'-from">'+keys.map(k=>'<option value="'+k+'">'+units[k]+'</option>').join('')+'</select></div>'
    +'<div class="field"><label>结果</label><div id="'+id+'-out"></div></div>'
    +'<div class="hint" style="color:var(--muted);font-size:12px">输入数值+单位自动识别（如 123kg、100米、60公里/小时），也可只填数值再选单位。</div>';
  },init(){const val=$('#'+id+'-v');const from=$('#'+id+'-from');const box=$('#'+id+'-out');
    if(defaults){from.value=defaults.from;val.value=defaults.text!=null?defaults.text:(defaults.v+'')}
    const calc=()=>{
      const raw=val.value;
      if(!raw.trim()){box.innerHTML='';return}
      const p=parseUnit(raw,from.value);
      if(!p){box.innerHTML='<div class="hint" style="color:#e5484d">请输入数值，如 123'+units[from.value]+'</div>';return}
      if(!p.ok){box.innerHTML='<div class="hint" style="color:#f59e0b">未识别单位“'+raw.replace(/^[-+]?\d[\d,.eE]*/,'').trim()+'”，已按所选单位换算；请检查单位或从下拉选择。</div>'}
      if(from.value!==p.key)from.value=p.key;
      const base=p.v*factors[p.key];
      const rows=keys.map(k=>[units[k],base/factors[k],k===p.key]);
      box.innerHTML='<div class="out-box">'+rows.map(r=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed var(--border);'+(r[2]?'font-weight:700;color:var(--accent)':'')+'"><span style="color:'+(r[2]?'var(--accent)':'var(--muted)')+'">'+r[0]+'</span><span class="mono" style="font-weight:600">'+fmtNum(r[1])+'</span></div>').join('')+'</div>';
    };
    val.addEventListener('input',calc);from.addEventListener('change',calc);calc();
  }};
}

function numToCnRmb(n){
  if(isNaN(n)||n<0)return '请输入有效金额';
  const units=['','拾','佰','仟'],digits='零壹贰叁肆伍陆柒捌玖';
  n=Math.round(n*100)/100;const intPart=Math.floor(n),dec=Math.round((n-intPart)*100);
  function cnInt(i){if(i===0)return '零';const big=['','万','亿','万亿'];let s='',group=0;while(i>0){const seg=i%10000;let segs='';const digs=String(seg);for(let k=0;k<digs.length;k++){const d=parseInt(digs[k]);const pos=digs.length-1-k;if(d===0){if(segs&&!segs.endsWith('零'))segs+='零'}else{if(pos>0&&segs){}segs+=digits[d]+(pos>0?units[pos%4]:'')}}if(segs.endsWith('零'))segs=segs.slice(0,-1);s=segs+(seg>0?big[group]:'')+s;i=Math.floor(i/10000);group++}return s.replace(/^零+/,'')||'零'}
  let out=cnInt(intPart)+'元';if(dec===0)out+='整';else{const j=Math.floor(dec/10),f=dec%10;if(j)out+=digits[j]+'角';if(f)out+=digits[f]+'分'}return out.replace(/零角/,'').replace(/零元/,'元');
}

const TR_DICT=I18N;
const TR_KEYS=Object.keys(TR_DICT).sort((a,b)=>b.length-a.length);
let LANG=(function(){try{return localStorage.getItem('doubao_lang')==='en'?'en':'zh'}catch(e){return 'zh'}})();
function tr(s){
  if(!s||typeof s!=='string')return s;
  if(!/[\u4e00-\u9fff]/.test(s))return s;
  let out=s;
  for(let i=0;i<TR_KEYS.length;i++){const k=TR_KEYS[i];if(out.indexOf(k)>=0)out=out.split(k).join(TR_DICT[k]);}
  return out;
}
function trAllowed(el){
  if(!el||el.nodeType!==1)return false;
  if(el.closest('input,textarea,select,script,style,[data-noxlate]'))return false;
  if(el.closest('.stat-box .v'))return false;               // 结果值保留
  if(el.closest('.o-label')||el.closest('.stat-box .k'))return true; // UI 标签
  if(el.closest('[id^="v-"],[id^="out-"],[id$="-out"]'))return false; // 数据/结果容器
  return true;
}
function trNodeText(node){
  if(node.nodeType!==3)return;
  if(!/[\u4e00-\u9fff]/.test(node.nodeValue))return;
  const p=node.parentElement; if(!p||!trAllowed(p))return;
  node.nodeValue=tr(node.nodeValue);
}
function trEl(el){
  if(!el||el.nodeType!==1)return;
  if(el.hasAttribute('placeholder')&&el.getAttribute('placeholder'))el.setAttribute('placeholder',tr(el.getAttribute('placeholder')));
  if(el.hasAttribute('title')&&el.getAttribute('title')&&el.closest('input,button,.icon-btn,#skinBtn,#toggleTheme,#langSwitch'))el.setAttribute('title',tr(el.getAttribute('title')));
}
function translateSubtree(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(!/[\u4e00-\u9fff]/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    const p=n.parentElement; if(!p||!trAllowed(p))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[];let n;while((n=walker.nextNode()))nodes.push(n);
  for(const node of nodes)node.nodeValue=tr(node.nodeValue);
  root.querySelectorAll&&root.querySelectorAll('[placeholder]').forEach(trEl);
}
function setLangUI(){
  const track=document.getElementById('langTrack'); if(track)track.classList.toggle('en',LANG==='en');
  const knob=document.getElementById('langKnob'); if(knob)knob.textContent=LANG==='en'?'A':'中';
  document.querySelectorAll('#langSwitch .lang-label').forEach(el=>el.classList.toggle('active',el.dataset.l===LANG));
  document.documentElement.lang=LANG==='en'?'en':'zh-CN';
}
function applyLang(lang,rerender){
  LANG=lang;
  try{localStorage.setItem('doubao_lang',LANG)}catch(e){}
  if(typeof renderNav==='function'&&typeof renderGrid==='function'){
    const wasOpen=!!curTool&&document.getElementById('panelOverlay').classList.contains('show');
    const openId=curTool?curTool.id:null;
    renderNav();
    renderGrid();
    if(wasOpen&&openId&&TOOLS[openId])openTool(openId);
  }
  setLangUI();
  if(LANG==='en')translateSubtree(document.body);
}
const i18nObs=new MutationObserver(muts=>{
  if(LANG!=='en')return;
  for(const mu of muts){
    for(const nd of mu.addedNodes){
      if(nd.nodeType===1)translateSubtree(nd);
      else if(nd.nodeType===3)trNodeText(nd);
    }
  }
});
if(document.body)i18nObs.observe(document.body,{childList:true,subtree:true});
(function initLang(){
  const sw=document.getElementById('langSwitch');
  if(sw)sw.addEventListener('click',()=>applyLang(LANG==='en'?'zh':'en',true));
  setLangUI();
})();

renderSkins();

renderNav();
renderGrid();
applyLang(LANG,false);
